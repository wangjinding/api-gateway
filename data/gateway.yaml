# AI 网关配置文件（data/ 目录）
#
# ⚠ 本文件由管理页面「网关配置」生成（管理员账号），页面保存时会**整份重写**：
#   想要的历史决策/踩坑说明在 README.md（按轮次记录），这里只保留必要的现场注释。
#   手改本文件仍然有效（server.hot_reload=true 时按 mtime 自动重载），
#   但页面下次保存会以页面上的值为准 —— 改配置优先用页面。
#
# 端口默认 8808；密钥统一走 auth.token_env 指向的环境变量（本机见 .env），不在 yaml 存明文。
# 本文件是项目的唯一配置文件（run.py 默认读取；GATEWAY_CONFIG 可覆盖）。
# ── 供应商 + 模型清单 ───────────────────────────────────
# auth.token_env 指向存放密钥的环境变量；auth.token 只有在不用环境变量时才填（明文）。
# media 段留空 = 该供应商不支持图像/视频（Agnes 是自有非标准端点，故单独覆盖）。
# models.type: text | image | video；vision: 该模型是否支持图像输入（带图对话会被优先排到链首）。
providers:
  agnes:
    name: Agnes AI
    base_url: https://api.agnes-ai.cn/v1
    auth:
      token_env: AGNES_API_KEY
      token: ''
    extra_headers: {}
    rate_limit_rps: null
    requires_session_header: false
    endpoints:
      chat/completions:
        path: /chat/completions
        auth: bearer
        headers: {}
      messages:
        path: /messages
        auth: x-api-key
        headers:
          anthropic-version: '2023-06-01'
      responses:
        path: /responses
        auth: bearer
        headers: {}
    media:
      image_endpoint: /images/generations
      image_default_size: 1K
      video_create_endpoint: /videos
      video_poll_base: https://api.agnes-ai.cn
      video_poll_path: /agnesapi
      video_model_name: agnes-video-2.5-flash
    models:
    - id: agnes-3.0-flash
      display_name: Agnes 3.0 Flash
      type: text
      vision: true
      protocols:
      - chat/completions
    - id: agnes-2.5-flash
      display_name: Agnes 2.5 Flash
      type: text
      vision: true
      protocols:
      - chat/completions
    - id: agnes-image-2.5-flash
      display_name: Agnes Image 2.5 Flash
      type: image
      vision: false
      protocols:
      - chat/completions
    - id: agnes-video-2.5-flash
